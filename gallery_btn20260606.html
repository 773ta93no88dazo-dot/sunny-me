<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>水彩画ギャラリー｜メルカリ出品中</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Noto+Serif+JP:wght@300;400&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f7f4ef; --ink:#1a1612; --accent:#8b6f47;
  --muted:#a09080; --card-bg:#fff; --border:#ddd6cb; --red:#e8380d;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--ink);font-family:'Noto Serif JP',serif;}

header{text-align:center;padding:50px 20px 30px;border-bottom:1px solid var(--border);}
header::before{content:'';display:block;width:40px;height:1px;background:var(--accent);margin:0 auto 18px;}
.site-label{font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;}
h1{font-family:'Cormorant Garamond',serif;font-size:clamp(26px,5vw,48px);font-weight:300;}
.subtitle{font-size:13px;color:var(--muted);margin-top:12px;line-height:1.8;}
.badge{display:inline-block;background:var(--red);color:#fff;font-size:11px;padding:4px 14px;border-radius:2px;margin-top:14px;}

.admin-bar{text-align:center;padding:16px;}
.btn-admin{background:none;border:1px solid var(--border);color:var(--muted);font-size:12px;padding:6px 16px;cursor:pointer;font-family:'Noto Serif JP',serif;border-radius:2px;}
.btn-admin:hover{border-color:var(--accent);color:var(--accent);}

.admin-panel{display:none;background:#fff;border:1px solid var(--border);max-width:500px;margin:0 auto 20px;padding:24px;}
.admin-panel.open{display:block;}
.admin-panel h3{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:400;margin-bottom:16px;}
.field{margin-bottom:12px;}
.field label{font-size:11px;letter-spacing:.1em;color:var(--muted);display:block;margin-bottom:4px;}
.field input,.field textarea{width:100%;border:1px solid var(--border);padding:8px 10px;font-family:'Noto Serif JP',serif;font-size:13px;background:var(--bg);}
.field textarea{height:70px;resize:vertical;}
.img-preview{width:100%;max-height:150px;object-fit:contain;margin-bottom:8px;display:none;background:var(--bg);}
.btn-add{width:100%;background:var(--accent);color:#fff;border:none;padding:10px;font-family:'Noto Serif JP',serif;font-size:13px;cursor:pointer;margin-top:8px;}

.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:2px;padding:16px 2px 60px;max-width:1200px;margin:0 auto;}
.card{background:var(--card-bg);cursor:pointer;overflow:hidden;transition:transform .3s,box-shadow .3s;animation:fadeUp .5s ease both;position:relative;}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 40px rgba(0,0,0,.12);z-index:1;}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.img-wrap{aspect-ratio:4/3;overflow:hidden;background:#ede9e2;position:relative;}
.img-wrap img{width:100%;height:100%;object-fit:cover;transition:transform .5s;}
.card:hover .img-wrap img{transform:scale(1.05);}
.sold-overlay{position:absolute;inset:0;background:rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;}
.sold-stamp{background:var(--ink);color:#fff;font-size:12px;letter-spacing:.2em;padding:8px 20px;font-family:'Cormorant Garamond',serif;}
.card-body{padding:16px 18px 18px;border-top:1px solid var(--border);}
.card-title{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:400;margin-bottom:4px;line-height:1.3;}
.card-desc{font-size:12px;color:var(--muted);line-height:1.7;margin-bottom:12px;}
.card-footer{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.price{font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:300;}
.btn-m{background:var(--red);color:#fff;font-size:11px;padding:6px 14px;text-decoration:none;border-radius:2px;white-space:nowrap;border:none;cursor:pointer;font-family:'Noto Serif JP',serif;}
.btn-m:hover{opacity:.85;}
.btn-m.sold{background:var(--muted);pointer-events:none;}

/* モーダル */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(20,16,12,.75);z-index:200;align-items:center;justify-content:center;padding:16px;}
.modal-bg.open{display:flex;}
.modal{background:#fff;max-width:580px;width:100%;max-height:90vh;overflow-y:auto;position:relative;border-radius:2px;}
.modal-img{width:100%;max-height:320px;object-fit:contain;background:var(--bg);display:block;}
.modal-body{padding:20px 22px 22px;}
.modal-title{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:300;margin-bottom:8px;}
.modal-desc{font-size:13px;color:var(--muted);line-height:1.9;margin-bottom:16px;}
.modal-price-row{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border);padding-top:14px;margin-bottom:14px;}
.modal-price{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:300;}

/* ボタンエリア：縦並び */
.modal-btns{display:flex;flex-direction:column;gap:10px;}
.btn-merucari{display:block;text-align:center;background:var(--red);color:#fff;font-size:13px;padding:12px;text-decoration:none;border-radius:2px;font-family:'Noto Serif JP',serif;border:none;cursor:pointer;width:100%;}
.btn-merucari:hover{opacity:.85;}
.btn-merucari.sold{background:var(--muted);pointer-events:none;}
.btn-sold-toggle{display:block;width:100%;text-align:center;background:none;border:1px solid var(--accent);color:var(--accent);font-size:13px;padding:11px;cursor:pointer;border-radius:2px;font-family:'Noto Serif JP',serif;}
.btn-sold-toggle.is-sold{background:var(--accent);color:#fff;}
.btn-delete{display:block;width:100%;text-align:center;background:none;border:1px solid #ddd;color:#bbb;font-size:12px;padding:10px;cursor:pointer;border-radius:2px;font-family:'Noto Serif JP',serif;}
.btn-delete:hover{border-color:#e44;color:#e44;}

.close-btn{position:absolute;top:12px;right:14px;background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer;z-index:1;line-height:1;}

.related{padding:16px 22px 22px;border-top:1px solid var(--border);}
.related-label{font-size:11px;letter-spacing:.15em;color:var(--muted);margin-bottom:12px;}
.related-grid{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;}
.related-item{flex:0 0 84px;cursor:pointer;}
.related-item img{width:84px;height:63px;object-fit:cover;border:2px solid transparent;transition:border-color .2s;}
.related-item:hover img{border-color:var(--accent);}
.related-item p{font-size:10px;color:var(--muted);text-align:center;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

footer{text-align:center;padding:36px 20px;border-top:1px solid var(--border);font-size:12px;color:var(--muted);}
@media(max-width:560px){.gallery{grid-template-columns:repeat(2,1fr);}}
</style>
</head>
<body>

<header>
  <p class="site-label">Watercolor Art Gallery</p>
  <h1>水彩画ギャラリー</h1>
  <p class="subtitle">すべてメルカリにて新品出品中。<br>お気に入りの一枚を見つけてください。</p>
  <span class="badge">全作品 ¥3,800（送料込み）</span>
</header>

<div class="admin-bar">
  <button class="btn-admin" id="toggleAdmin">⚙️ 管理画面を開く</button>
</div>

<div class="admin-panel" id="adminPanel">
  <h3>作品を追加する</h3>
  <div class="field"><label>タイトル</label><input type="text" id="newTitle" placeholder="例：桜の水彩画"></div>
  <div class="field"><label>説明文</label><textarea id="newDesc" placeholder="作品の説明を入力..."></textarea></div>
  <div class="field"><label>値段</label><input type="text" id="newPrice" value="¥3,800"></div>
  <div class="field"><label>メルカリのURL</label><input type="text" id="newUrl" placeholder="https://jp.mercari.com/item/..."></div>
  <div class="field"><label>画像ファイル</label><img id="previewImg" class="img-preview"><input type="file" id="newImg" accept="image/*"></div>
  <button class="btn-add" id="btnAdd">＋ 追加する</button>
</div>

<div class="gallery" id="gallery"></div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <button class="close-btn" id="closeBtn">✕</button>
    <img class="modal-img" id="modalImg" src="" alt="">
    <div class="modal-body">
      <h2 class="modal-title" id="modalTitle"></h2>
      <p class="modal-desc" id="modalDesc"></p>
      <div class="modal-price-row">
        <span class="modal-price" id="modalPrice"></span>
      </div>
      <div class="modal-btns">
        <a href="#" id="modalLink" class="btn-merucari" target="_blank">メルカリで見る →</a>
        <button class="btn-sold-toggle" id="btnSoldToggle">✅ 売却済みにする</button>
        <button class="btn-delete" id="btnDelete">🗑️ この作品を削除する</button>
      </div>
    </div>
    <div class="related">
      <p class="related-label">OTHER WORKS — 他の作品も見る</p>
      <div class="related-grid" id="relatedGrid"></div>
    </div>
  </div>
</div>

<footer>
  <p>水彩画ギャラリー ｜ メルカリにて新品出品中</p>
  <p style="margin-top:6px;">気になる作品はメルカリのページからお問い合わせください😊</p>
</footer>

function load() {
  try {
    const s = localStorage.getItem('gallery_v2');
    if(s) {
      const saved = JSON.parse(s);
      INITIAL.forEach(item => {
        if(!saved.some(p => p.id === item.id)) saved.unshift({...item});
      });
      return saved;
    }
  } catch(e) {}
  return JSON.parse(JSON.stringify(INITIAL));
}
function save(p) { try { localStorage.setItem('gallery_v2', JSON.stringify(p)); } catch(e) {} }

    card.style.animationDelay = (i*0.05)+'s';
    card.innerHTML = `
      <div class="img-wrap">
        <img src="${p.img}" alt="${p.title}" loading="lazy">
        ${p.sold?'<div class="sold-overlay"><span class="sold-stamp">SOLD</span></div>':''}
      </div>
      <div class="card-body">
        <h2 class="card-title">${p.title}</h2>
        <p class="card-desc">${p.desc.substring(0,38)}…</p>
        <div class="card-footer">
          <span class="price">${p.price}</span>
          ${p.sold
            ?'<span class="btn-m sold">売却済み</span>'
            :!p.url
              ?'<span class="btn-m sold">出品準備中</span>'
            :`<a href="${p.url}" class="btn-m" target="_blank" onclick="event.stopPropagation()">メルカリで見る →</a>`
          }
        </div>
      </div>`;
    card.addEventListener('click', ()=>openModal(p.id));
    g.appendChild(card);
  });
}

function openModal(id) {
  currentId = id;
  const p = paintings.find(x=>x.id===id);
  document.getElementById('modalImg').src = p.img;
  document.getElementById('modalTitle').textContent = p.title;
  document.getElementById('modalDesc').textContent = p.desc;
  document.getElementById('modalPrice').textContent = p.price;

  const link = document.getElementById('modalLink');
  const toggle = document.getElementById('btnSoldToggle');
  if(p.sold) {
    link.textContent='売却済み'; link.className='btn-merucari sold'; link.removeAttribute('href');
    toggle.textContent='🔄 出品中に戻す'; toggle.className='btn-sold-toggle is-sold';
  } else if(!p.url) {
    link.textContent='出品準備中'; link.className='btn-merucari sold'; link.removeAttribute('href');
    toggle.textContent='✅ 売却済みにする'; toggle.className='btn-sold-toggle';
  } else {
    link.textContent='メルカリで見る →'; link.className='btn-merucari'; link.href=p.url;
    toggle.textContent='✅ 売却済みにする'; toggle.className='btn-sold-toggle';
  }

  const grid = document.getElementById('relatedGrid');
  grid.innerHTML='';
  paintings.filter(x=>x.id!==id).forEach(r=>{
    const item=document.createElement('div');
    item.className='related-item';
    item.innerHTML=`<img src="${r.img}" alt="${r.title}"><p>${r.title}</p>`;
    item.addEventListener('click',()=>openModal(r.id));
    grid.appendChild(item);
  });

  document.getElementById('modalBg').classList.add('open');
  document.body.style.overflow='hidden';
}

function closeModal() {
  document.getElementById('modalBg').classList.remove('open');
  document.body.style.overflow='';
  currentId=null;
}

document.getElementById('btnSoldToggle').addEventListener('click',()=>{
  const p=paintings.find(x=>x.id===currentId);
  if(p){ p.sold=!p.sold; save(paintings); closeModal(); render(); }
});

document.getElementById('btnDelete').addEventListener('click',()=>{
  if(confirm('この作品を削除しますか？')){
    paintings=paintings.filter(x=>x.id!==currentId);
    save(paintings); closeModal(); render();
  }
});

document.getElementById('closeBtn').addEventListener('click',closeModal);
document.getElementById('modalBg').addEventListener('click',e=>{if(e.target===document.getElementById('modalBg'))closeModal();});

document.getElementById('toggleAdmin').addEventListener('click',()=>{
  document.getElementById('adminPanel').classList.toggle('open');
});

document.getElementById('newImg').addEventListener('change',e=>{
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const p=document.getElementById('previewImg');
    p.src=ev.target.result; p.style.display='block';
  };
  reader.readAsDataURL(file);
});

document.getElementById('btnAdd').addEventListener('click',()=>{
  const title=document.getElementById('newTitle').value.trim();
  const desc=document.getElementById('newDesc').value.trim();
  const price=document.getElementById('newPrice').value.trim()||'¥3,800';
  const url=document.getElementById('newUrl').value.trim();
  const imgEl=document.getElementById('previewImg');
  if(!title){alert('タイトルを入力してね！');return;}
  if(!imgEl.src||imgEl.style.display==='none'){alert('画像を選択してね！');return;}
  paintings.push({id:Date.now(),title,desc,price,url,img:imgEl.src,sold:false});
  save(paintings); render();
  document.getElementById('newTitle').value='';
  document.getElementById('newDesc').value='';
  document.getElementById('newPrice').value='¥3,800';
  document.getElementById('newUrl').value='';
  document.getElementById('newImg').value='';
  imgEl.src=''; imgEl.style.display='none';
  document.getElementById('adminPanel').classList.remove('open');
  alert('追加したよ！');
});

render();
</script>
</body>
</html>
