<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>水彩画ギャラリー｜メルカリ出品中</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Noto+Serif+JP:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f4ef;
    --ink: #1a1612;
    --accent: #8b6f47;
    --muted: #a09080;
    --card-bg: #ffffff;
    --border: #ddd6cb;
    --merucari: #e8380d;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font-family: 'Noto Serif JP', serif; min-height: 100vh; }

  header { text-align: center; padding: 60px 20px 40px; border-bottom: 1px solid var(--border); }
  header::before { content: ''; display: block; width: 40px; height: 1px; background: var(--accent); margin: 0 auto 20px; }
  .site-label { font-family: 'Cormorant Garamond', serif; font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }
  h1 { font-family: 'Cormorant Garamond', serif; font-size: clamp(28px, 6vw, 52px); font-weight: 300; letter-spacing: 0.05em; }
  .subtitle { font-size: 13px; color: var(--muted); margin-top: 14px; letter-spacing: 0.05em; line-height: 1.8; }
  .merucari-badge { display: inline-block; background: var(--merucari); color: white; font-size: 11px; padding: 4px 12px; border-radius: 2px; margin-top: 16px; letter-spacing: 0.05em; }

  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2px; padding: 16px 2px 60px; max-width: 1200px; margin: 0 auto; }

  .card { background: var(--card-bg); overflow: hidden; cursor: pointer; transition: transform 0.3s ease, box-shadow 0.3s ease; position: relative; animation: fadeUp 0.5s ease both; }
  .card:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(0,0,0,0.12); z-index: 1; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  .img-wrap { aspect-ratio: 4/3; overflow: hidden; background: #ede9e2; position: relative; }
  .img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; display: block; }
  .card:hover .img-wrap img { transform: scale(1.04); }

  .sold-overlay { position: absolute; inset: 0; background: rgba(255,255,255,0.6); display: flex; align-items: center; justify-content: center; }
  .sold-label { background: var(--ink); color: white; font-size: 12px; letter-spacing: 0.2em; padding: 8px 20px; font-family: 'Cormorant Garamond', serif; }

  .card-body { padding: 18px 20px 20px; border-top: 1px solid var(--border); }
  .card-title { font-family: 'Cormorant Garamond', serif; font-size: 19px; font-weight: 400; line-height: 1.3; margin-bottom: 4px; }
  .card-desc { font-size: 12px; color: var(--muted); line-height: 1.7; margin-bottom: 14px; }
  .card-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .price { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 300; }
  .price span { font-size: 13px; margin-right: 2px; }
  .btn-merucari { display: inline-block; background: var(--merucari); color: white; font-size: 11px; letter-spacing: 0.08em; padding: 7px 16px; text-decoration: none; border-radius: 2px; transition: opacity 0.2s; white-space: nowrap; }
  .btn-merucari:hover { opacity: 0.85; }
  .btn-merucari.sold { background: var(--muted); pointer-events: none; }

  footer { text-align: center; padding: 40px 20px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); letter-spacing: 0.05em; }
  footer::before { content: ''; display: block; width: 30px; height: 1px; background: var(--border); margin: 0 auto 20px; }

  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(20,16,12,0.7); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
  .modal-bg.open { display: flex; }
  .modal { background: var(--card-bg); max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; position: relative; }
  .modal img { width: 100%; display: block; max-height: 380px; object-fit: contain; background: var(--bg); }
  .modal-body { padding: 24px 28px 28px; }
  .modal-title { font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 300; line-height: 1.2; margin-bottom: 10px; }
  .modal-desc { font-size: 13px; color: var(--muted); line-height: 1.9; margin-bottom: 20px; }
  .modal-footer { display: flex; align-items: center; justify-content: space-between; padding-top: 20px; border-top: 1px solid var(--border); }
  .modal-price { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 300; }
  .close-btn { position: absolute; top: 14px; right: 18px; background: none; border: none; font-size: 22px; color: var(--muted); cursor: pointer; }

  .related { padding: 20px 28px 24px; border-top: 1px solid var(--border); margin-top: 4px; }
  .related-label { font-size: 11px; letter-spacing: 0.15em; color: var(--muted); margin-bottom: 14px; }
  .related-grid { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; }
  .related-item { flex: 0 0 90px; cursor: pointer; }
  .related-item img { width: 90px; height: 68px; object-fit: cover; display: block; border: 2px solid transparent; transition: border-color 0.2s; }
  .related-item:hover img { border-color: var(--accent); }
  .related-item p { font-size: 10px; color: var(--muted); margin-top: 4px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  @media (max-width: 600px) { .gallery { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>

const gallery = document.getElementById('gallery');
const modalBg = document.getElementById('modalBg');
const closeBtn = document.getElementById('closeBtn');

function renderGallery() {
  gallery.innerHTML = '';
  paintings.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.style.animationDelay = (i * 0.06) + 's';
    card.innerHTML = `
      <div class="img-wrap">
        <img src="${p.img}" alt="${p.title}" loading="lazy">
        ${p.sold ? '<div class="sold-overlay"><span class="sold-label">SOLD</span></div>' : ''}
      </div>
      <div class="card-body">
        <h2 class="card-title">${p.title}</h2>
        <p class="card-desc">${p.desc.substring(0,40)}…</p>
        <div class="card-footer">
          <span class="price"><span>¥</span>${p.price.replace('¥','')}</span>
          ${p.sold
            ? '<span class="btn-merucari sold">売却済み</span>'
            : `<a href="${p.url}" class="btn-merucari" target="_blank" onclick="event.stopPropagation()">メルカリで見る →</a>`}
        </div>
      </div>`;
    card.addEventListener('click', () => openModal(p));
    gallery.appendChild(card);
  });
}

function openModal(p) {
  document.getElementById('modalImg').src = p.img;
  document.getElementById('modalImg').alt = p.title;
  document.getElementById('modalTitle').textContent = p.title;
  document.getElementById('modalDesc').textContent = p.desc;
  document.getElementById('modalPrice').textContent = p.price;
  const btn = document.getElementById('modalBtn');
  if (p.sold) {
    btn.textContent = '売却済み';
    btn.className = 'btn-merucari sold';
    btn.removeAttribute('href');
  } else {
    btn.textContent = 'メルカリで見る →';
    btn.className = 'btn-merucari';
    btn.href = p.url;
  }
  const related = paintings.filter(x => x.id !== p.id);
  const grid = document.getElementById('relatedGrid');
  grid.innerHTML = '';
  related.forEach(r => {
    const item = document.createElement('div');
    item.className = 'related-item';
    item.innerHTML = `<img src="${r.img}" alt="${r.title}"><p>${r.title}</p>`;
    item.addEventListener('click', () => openModal(r));
    grid.appendChild(item);
  });
  modalBg.classList.add('open');
  document.body.style.overflow = 'hidden';
}

closeBtn.addEventListener('click', () => { modalBg.classList.remove('open'); document.body.style.overflow = ''; });
modalBg.addEventListener('click', (e) => { if (e.target === modalBg) { modalBg.classList.remove('open'); document.body.style.overflow = ''; } });

renderGallery();
</script>
